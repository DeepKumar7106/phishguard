services:
  - type: web
    name: phishguard-backend
    runtime: node
    plan: free
    rootDir: backend
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run prisma:generate
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: OLLAMA_ENABLED
        value: "true"
      - key: OLLAMA_HOST
        sync: false
      - key: OLLAMA_MODEL
        value: qwen2.5:7b-instruct
      - key: OLLAMA_TIMEOUT_MS
        value: "25000"
